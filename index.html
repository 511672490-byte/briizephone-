/* instagram */
#igcall{background:radial-gradient(circle at 50% 28%,#2b2b30,#000 68%);color:#fff;text-align:center}
.cav{position:absolute;top:calc(var(--top) + 90px);left:50%;margin-left:-62px;width:124px;height:124px;border-radius:50%;animation:br 1.8s ease-in-out infinite;object-fit:cover;font-size:52px}
@keyframes br{50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(255,255,255,.07),0 0 0 30px rgba(255,255,255,.04)}}
.cnm2{position:absolute;top:calc(var(--top) + 240px);width:100%;font-size:26px;font-weight:700}
.cs1{position:absolute;top:calc(var(--top) + 278px);width:100%;font-size:15px;color:#a8a8a8}
.cs2{position:absolute;top:calc(var(--top) + 306px);width:100%;font-size:14px;color:#8e8e93;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.cbt{position:absolute;bottom:calc(var(--bot) + 56px);left:0;right:0;display:flex;justify-content:space-around;padding:0 50px}
.rb{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rb svg{width:34px;height:34px;fill:#fff}
#igvideo{background:#111;color:#fff}
#igvideo video.fs{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#3a2a4a,#101018)}
.ov{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),transparent 22%,transparent 50%,rgba(0,0,0,.55));pointer-events:none}
.itp{position:absolute;top:calc(var(--top) + 4px);left:16px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.itp b{display:block;font-size:17px}
.itp span{font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
#pip{position:absolute;top:calc(var(--top) + 4px);right:14px;width:98px;height:140px;border-radius:16px;overflow:hidden;background:#333;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.4);z-index:5}
#pip video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.ib{position:absolute;left:0;right:0;bottom:var(--bot);padding:0 14px 8px}
#igchat{width:74%;display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-height:20px}
.m{color:#fff;font-size:14px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.75);background:rgba(0,0,0,.2);padding:6px 11px;border-radius:15px;width:fit-content;transition:opacity 1s;animation:pop .25s}
.m.fd{opacity:0}
.br{display:flex;justify-content:space-between;padding:0 6px;margin-bottom:14px}
.cb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;cursor:pointer}
.cb svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cb.off{background:#fff;color:#111}
.cb.off:after{content:"";position:absolute;width:30px;height:2px;background:#111;transform:rotate(-45deg)}
.cb.red{background:#ff3b30}
.cb.red svg{fill:#fff;stroke:none;transform:rotate(135deg)}
.mi{display:flex;align-items:center;height:44px;border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:0 6px 0 16px}
.mi input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;-webkit-user-select:text;user-select:text}
.mi input::placeholder{color:rgba(255,255,255,.75)}
.mi svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mi.h svg{opacity:1}
/* spotify */
#sp,#spfull{background:#121212;color:#fff}
#sp{background:linear-gradient(#2d5a3f,#121212 380px) #121212}
.cv{background:linear-gradient(135deg,#3a3a3f,#18181b);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;color:#b3b3b3;overflow:hidden}
.cv svg{width:38%;height:38%;fill:currentColor}
.sp1{width:212px;height:212px;margin:8px auto 18px;box-shadow:0 10px 36px rgba(0,0,0,.55)}
.spt{padding:0 16px}
.spt h1{font-size:24px;font-weight:800}
.spc{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;margin-top:8px}
.spc .av{width:22px;height:22px;border-radius:50%;background:#1db954;color:#000;font-size:11px}
.spn{font-size:13px;color:#b3b3b3;margin-top:5px}
.spa{display:flex;align-items:center;gap:20px;padding:14px 16px 8px}
.spa svg{width:26px;height:26px;stroke:#b3b3b3;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spa .sf{margin-left:auto}
.pb{width:56px;height:56px;border-radius:50%;background:#1db954;display:flex;align-items:center;justify-content:center;flex:none}
.pb svg{width:28px;height:28px;fill:#000;stroke:none}
.sr{display:flex;align-items:center;padding:9px 16px;gap:10px}
.si{flex:1;min-width:0}
.st{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.sr.pl .st{color:#1db954}
.sa{font-size:13px;color:#b3b3b3;margin-top:2px}
.sr>svg{width:22px;height:22px;fill:#b3b3b3}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:#1db954;height:5px}
.eq.go i{animation:eq .8s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.3s!important;height:9px}
.eq i:nth-child(3){animation-delay:-.6s!important;height:6px}
@keyframes eq{50%{height:12px}}
#mini{position:absolute;left:8px;right:8px;bottom:calc(var(--bot) + 6px);height:56px;border-radius:10px;background:#3a4a41;display:none;align-items:center;padding:0 12px 0 8px;gap:10px;z-index:10;overflow:hidden}

#spfull{background:linear-gradient(#43594c,#121212 70%)}
.fh{position:absolute;top:var(--top);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;text-align:center}

.fc{position:absolute;top:calc(var(--top) + 56px);left:28px;right:28px;aspect-ratio:1;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.fi{position:absolute;left:28px;right:28px;bottom:calc(var(--bot) + 200px)}
.fi h2{font-size:23px;font-weight:800}

.fs{position:absolute;left:28px;right:28px;bottom:calc(var(--bot) + 128px)}
